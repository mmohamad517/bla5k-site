name: Content QA

# Runs automatically on every content change (saves from Pages CMS on the
# `draft` branch, and on `main`). READ-ONLY report — never edits/blocks. No AI.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'src/data/categories.ts'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa:
    name: Check content before it goes live
    runs-on: ubuntu-latest
    env:
      QA_CMS_BRANCH: draft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run content QA bot
        run: node scripts/content-qa.mjs
      - name: Check all links (internal + external)
        run: node scripts/link-check.mjs
      - name: Submit URLs to IndexNow (instant indexing)
        # Sends every URL to Bing/Yandex/Seznam/Naver for immediate crawl
        # after each content change. Key file auto-detected from public/.
        run: node scripts/indexnow.mjs || true
