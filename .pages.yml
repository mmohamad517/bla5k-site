            { value: sec-antivirus,    label: "Security · Antivirus & Malware" },
            { value: host-hosting,     label: "Hosting · Web Hosting" },
            { value: host-domains,     label: "Hosting · Domains" },
            { value: host-builders,    label: "Hosting · Site Builders" },
            { value: mkt-seo,          label: "Marketing · SEO Tools" },
            { value: mkt-email,        label: "Marketing · Email Marketing" },
            { value: mkt-social,       label: "Marketing · Social Media" },
            { value: mkt-analytics,    label: "Marketing · Analytics" },
            { value: fin-accounting,   label: "Finance · Accounting & Invoicing" },
