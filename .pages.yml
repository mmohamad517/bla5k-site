##
# Pages CMS config for bla5k
# https://pagescms.org
#
# This file tells Pages CMS what forms to show you in the admin dashboard.
# It is NOT visible to visitors — nothing links to it, and the /admin lives
# on pagescms.org (external), not on bla5k.com.
##

media:
  input: public/media
  output: /media

content:
  # ─────────────────── Tools / Sites ───────────────────
  - name: sites
    label: "🛠 Tools & Sites"
    path: src/content/sites
    type: collection
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [name, subcategory, featured, updated]
      sort:   [updated, name]
      default:
        sort: updated
        order: desc
    fields:
      - { name: name,            label: "Name",            type: string,  required: true }
      - { name: url,             label: "Official URL",    type: string,  required: true, pattern: "^https?://.+" }
      - { name: subcategory,     label: "Subcategory",     type: select,  required: true, options: { values: [
            { value: ai-writing,       label: "AI Tools · Content Writing" },
            { value: ai-image,         label: "AI Tools · Image Generation" },
            { value: ai-video-audio,   label: "AI Tools · Video & Audio" },
            { value: ai-chat,          label: "AI Tools · Chatbots & Assistants" },
            { value: ai-productivity,  label: "AI Tools · AI Productivity" },
            { value: design-ui,        label: "Design · UI / UX Design" },
            { value: design-inspo,     label: "Design · Inspiration Galleries" },
            { value: design-color,     label: "Design · Color & Palettes" },
            { value: design-graphics,  label: "Design · Graphics & Editing" },
            { value: design-3d,        label: "Design · 3D & Home Design" },
            { value: dev-code,         label: "Developer · Code & Hosting" },
            { value: dev-docs,         label: "Developer · Docs & Reference" },
            { value: dev-play,         label: "Developer · Playgrounds" },
            { value: dev-ai-agents,    label: "Developer · AI Agents & Frameworks" },
            { value: prod-notes,       label: "Productivity · Notes & Docs" },
            { value: prod-tasks,       label: "Productivity · Tasks & Projects" },
            { value: prod-data,        label: "Productivity · Databases & Sheets" },
            { value: disc-launches,    label: "Discovery · New Launches" },
            { value: disc-alternatives,label: "Discovery · Alternatives & Compare" },
            { value: disc-news,        label: "Discovery · Tech News" },
            { value: learn-code,       label: "Learning · Learn to Code" },
            { value: learn-courses,    label: "Learning · Online Courses" },
            { value: learn-free,       label: "Learning · Free University" },
            { value: comm-forums,      label: "Community · Forums & Q&A" },
            { value: comm-makers,      label: "Community · Makers & Founders" },
            { value: comm-dev,         label: "Community · Developer Circles" },
            { value: media-photos,     label: "Media · Stock Photos" },
            { value: media-icons,      label: "Media · Icons" },
            { value: media-graphics,   label: "Media · Graphics & Vectors" },
            { value: media-fonts,      label: "Media · Fonts" },
            { value: nc-builders,      label: "No-Code · App & Site Builders" },
            { value: nc-automation,    label: "No-Code · Automation" },
            { value: util-images,      label: "Utilities · Image Tools" },
            { value: util-files,       label: "Utilities · Files & PDF" },
