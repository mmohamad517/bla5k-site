      - { name: tagline,         label: "Tagline (one line)", type: string,  required: true }
      - { name: tags,            label: "Tags",            type: string,  list: true }
      - { name: featured,        label: "Featured (★)",    type: boolean, default: false }
      - { name: affiliate,       label: "Force affiliate?", type: boolean, description: "Leave OFF for auto-detection from URL." }
      - { name: updated,         label: "Updated on",      type: date }
      - { name: metaTitle,       label: "SEO title (optional)",       type: string }
      - { name: metaDescription, label: "SEO description (optional)", type: text }
      - { name: faqs,            label: "FAQs (for Position Zero)", type: object, list: true, fields: [
            { name: q, label: "Question", type: string },
            { name: a, label: "Answer",   type: text }
          ] }
      - { name: body,            label: "Article (Markdown)", type: text }

  # ─────────────────── Guides / Articles ───────────────────
  - name: guides
    label: "📝 Guides & Articles"
    path: src/content/guides
    type: collection
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, published, featured]
      sort:   [published, title]
      default:
        sort: published
        order: desc
    fields:
      - { name: title,       label: "Title",       type: string, required: true }
      - { name: description, label: "Description (meta)", type: text, required: true }
      - { name: keyword,     label: "Primary keyword", type: string }
      - { name: tags,        label: "Tags", type: string, list: true }
      - { name: category,    label: "Related category (optional)", type: select, options: { values: [
            { value: ai-tools, label: "AI Tools" },
            { value: design, label: "Design & Creative" },
            { value: developer, label: "Developer Tools" },
            { value: productivity, label: "Productivity" },
            { value: discovery, label: "Discovery & Launches" },
            { value: learning, label: "Learning & Courses" },
            { value: communities, label: "Communities & Forums" },
            { value: media, label: "Media & Assets" },
            { value: "no-code", label: "No-Code & Automation" },
            { value: utilities, label: "Utilities" },
            { value: security, label: "Security & Privacy" },
            { value: hosting, label: "Web Hosting & Domains" },
            { value: marketing, label: "Marketing & SEO" },
            { value: finance, label: "Business & Finance" },
            { value: shopping, label: "Shopping & Deals" },
            { value: "video-audio", label: "Video & Audio" },
            { value: writing, label: "Writing & Publishing" },
            { value: storage, label: "Cloud Storage & Files" },
            { value: careers, label: "Freelance & Careers" },
            { value: social, label: "Social & Networking" },
            { value: news, label: "News & Reading" },
            { value: entertainment, label: "Entertainment & Lifestyle" },
            { value: "ios-apps", label: "iOS Apps" },
            { value: "android-apps", label: "Android Apps" }
          ] } }
      - { name: author,     label: "Author", type: string, default: "bla5k" }
      - { name: published,  label: "Published on", type: date, required: true }
      - { name: updated,    label: "Updated on",   type: date }
      - { name: featured,   label: "Featured",     type: boolean, default: false }
      - { name: metaTitle,  label: "SEO title (optional)", type: string }
      - { name: faqs,       label: "FAQs (Position Zero)", type: object, list: true, fields: [
            { name: q, label: "Question", type: string },
            { name: a, label: "Answer",   type: text }
          ] }
      - { name: body,       label: "Article (Markdown, 2500+ words)", type: text }
